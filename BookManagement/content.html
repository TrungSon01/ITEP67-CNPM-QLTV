<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 100px;
    z-index: 1000;
  }

  .modal-content {
    background: white;
    padding: 20px;
    border-radius: 8px;
    width: 500px;
    max-width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .hidden {
    display: none !important;
  }

  .table-container {
    margin-top: 2rem;
  }

  .dropdown {
    position: relative;
    display: inline-block;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: white;
    min-width: 160px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    border-radius: 0.5rem;
    z-index: 1;
  }

  .dropdown-content a {
    color: #4a5568;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    transition: all 0.3s;
  }

  .dropdown-content a:hover {
    background-color: #f8f9fa;
    color: #1a202c;
  }

  .show {
    display: block;
  }
</style>

<script>
  tailwind.config = {
    theme: {
      extend: {
        keyframes: {
          fadeIn: {
            "0%": { opacity: "0", transform: "scale(0.95)" },
            "100%": { opacity: "1", transform: "scale(1)" },
          },
        },
        animation: {
          fadeIn: "fadeIn 0.4s ease-out",
        },
      },
    },
  };
</script>

<div class="bg-gray-100 p-6 mt-20">
  <div class="bg-white rounded-lg shadow-md overflow-hidden table-container">
    <div class="flex justify-between items-center p-6 bg-gray-50">
      <div class="flex items-center gap-4">
        <h2 class="text-xl font-semibold text-gray-700">Danh Sách Sách</h2>
        <div class="dropdown">
          <button
            onclick="toggleDropdown()"
            class="bg-green-500 text-white p-3 rounded-full hover:bg-green-600 transition duration-300"
            title="Tùy chọn"
          >
            <i class="fa fa-book-open text-xl"></i>
          </button>
          <div id="bookDropdown" class="dropdown-content">
            <a href="#" onclick="showAddModal()">
              <i class="fa fa-plus mr-2"></i>Thêm sách mới
            </a>
            <a href="#" onclick="showFilterOptions()">
              <i class="fa fa-filter mr-2"></i>Lọc sách
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table id="bookTable" class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              STT
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Tên Sách
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Tác Giả
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Thể Loại
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Ngày xuất bản
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <!-- Sách sẽ được thêm vào đây bằng JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Thêm Sách -->
  <div
    id="addModal"
    class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
  >
    <div
      class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white animate-fadeIn"
    >
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium text-gray-900">Thêm Sách Mới</h3>
        <button
          onclick="closeAddModal()"
          class="text-gray-500 hover:text-gray-700"
        >
          ✕
        </button>
      </div>
      <form id="bookForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700"
            >Tên sách</label
          >
          <input
            type="text"
            id="name"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Tác giả</label>
          <input
            type="text"
            id="author"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700"
            >Thể loại</label
          >
          <input
            type="text"
            id="category"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Mô tả</label>
          <input
            type="text"
            id="description"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Ngày</label>
          <input
            type="date"
            id="date"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div class="flex justify-end space-x-3">
          <button
            type="button"
            onclick="closeAddModal()"
            class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400"
          >
            Hủy
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600"
          >
            Thêm Sách
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Sửa sách -->
  <div
    id="updateModal"
    class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
  >
    <div
      class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white animate-fadeIn"
    >
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium text-gray-900">Sửa Thông Tin Sách</h3>
        <button
          onclick="closeUpdateModal()"
          class="text-gray-500 hover:text-gray-700"
        >
          ✕
        </button>
      </div>
      <form id="updateForm" class="space-y-4">
        <input type="hidden" id="updateBookId" />
        <div>
          <label class="block text-sm font-medium text-gray-700"
            >Tên sách</label
          >
          <input
            type="text"
            id="updateName"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Tác giả</label>
          <input
            type="text"
            id="updateAuthor"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700"
            >Thể loại</label
          >
          <input
            type="text"
            id="updateCategory"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Mô tả</label>
          <input
            type="text"
            id="updateDescription"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Ngày</label>
          <input
            type="date"
            id="updateDate"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div class="flex justify-end space-x-3 mt-4">
          <button
            type="button"
            onclick="closeUpdateModal()"
            class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400"
          >
            Hủy
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
          >
            Cập nhật
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Chi tiết sách -->
  <div
    id="detailModal"
    class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
  >
    <div
      class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white animate-fadeIn"
    >
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium text-gray-900">Chi tiết sách</h3>
        <button
          onclick="closeDetailModal()"
          class="text-gray-500 hover:text-gray-700"
        >
          ✕
        </button>
      </div>
      <div class="space-y-4">
        <div class="book-detail-content">
          <!-- Thông tin chi tiết sẽ đợc thêm vào đây -->
        </div>
        <div class="flex justify-end space-x-3 mt-6">
          <button
            onclick="showUpdateModal(currentBookId)"
            class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
          >
            Sửa
          </button>
          <button
            onclick="handleDelete()"
            class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600"
          >
            Xóa
          </button>
          <button
            onclick="closeDetailModal()"
            class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400"
          >
            Đóng
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
